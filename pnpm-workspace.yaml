packages:
  - "apps/*"
  - "packages/*"
  - "packs/*"
  - "tools/*"
allowBuilds:
  # pdfjs-dist (visualizador do Sign Off) lista o canvas nativo como opcional; ele só serve para rodar no Node — o navegador não usa. Nunca compilar.
  canvas: false
  # ffmpeg-static baixa o binário do ffmpeg no postinstall (renderização dos vídeos 9:16 do Gestor de Conteúdo, sem serviço pago).
  ffmpeg-static: true
minimumReleaseAgeExclude:
  - svix@1.97.0
